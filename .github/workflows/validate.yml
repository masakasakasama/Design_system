name: Validate design system

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tokens-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate platform outputs
        run: npm run generate
      - name: Reject stale generated files
        run: git diff --exit-code -- dist/web android/tatsu-design-system/src/main/java/com/masakasakasama/designsystem/generated
      - name: Reject hard-coded design values in authored shared UI
        run: npm run check:hardcoded

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate tokens
        run: node scripts/generate.mjs
      - name: Build Android library
        run: gradle :android:tatsu-design-system:assembleRelease
